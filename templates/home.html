{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST - Home</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .form-control {
            padding: 1.375rem .75rem !important;
        }
    </style>
</head>

<body>
<div class="container">
    <h3 class="pt-5 text-center">Django ToDo App</h3>

    <div class="row">
        <h4>My Day</h4>
        <p class="text-muted">{% now "jS F Y" %}</p>

        <!-- Pending Tasks -->
        <div class="col-md-7 col-lg-7" style="height: 450px; overflow-y: auto;">
            {% for task in tasks %}
            <div class="card m-1">
                <div class="card-body">
                    {{ task.task }}
                    <span class="float-end">
                        <a href="{% url 'markComplete' task.id %}" class="btn btn-success btn-sm">
                            <i class="fa fa-check"></i>
                        </a>
                        <a href="{% url 'editTask' task.id %}" class="btn btn-primary btn-sm">
                            <i class="fa fa-edit"></i>
                        </a>
                        <a href="{% url 'deleteTask' task.id %}" class="btn btn-danger btn-sm">
                            <i class="fa fa-trash"></i>
                        </a>
                    </span>
                </div>
            </div>
            {% empty %}
            <p class="text-muted">No pending tasks.</p>
            {% endfor %}
        </div>

        <!-- Completed Tasks -->
        <div class="col-md-5 col-lg-5">
            <h5>Completed Tasks</h5>

            {% for task in tasks_completed %}
            <div class="card m-1 bg-light">
                <div class="card-body">
                    <s>{{ task.task }}</s>
                    <span class="float-end">
                        <a href="{% url 'markUndone' task.id %}" class="btn btn-warning btn-sm">
                            <i class="fa fa-undo"></i>
                        </a>
                        <a href="{% url 'deleteTask' task.id %}" class="btn btn-danger btn-sm">
                            <i class="fa fa-trash"></i>
                        </a>
                    </span>
                </div>
            </div>
            {% empty %}
            <p class="text-muted">No completed tasks.</p>
            {% endfor %}
        </div>
    </div>

    <!-- Add Task Form -->
    <div class="row mt-4">
        <div class="col-md-8 mx-auto">
            <form action="{% url 'addTask' %}" method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="task" class="form-control" placeholder="Add a task" required>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa fa-plus"></i> Add
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
